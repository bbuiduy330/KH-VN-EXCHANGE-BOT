services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange -d exchange"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://exchange:exchange_change_me@postgres:5432/exchange?schema=public
      STORAGE_ROOT: /data/KH-VN-EXCHANGE
      DATA_DIR: /data/KH-VN-EXCHANGE
      RESTIC_REPOSITORY: /backup/restic-repo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - storage_data:/data/KH-VN-EXCHANGE
      - backup_data:/backup/restic-repo

volumes:
  postgres_data:
  storage_data:
  backup_data:
